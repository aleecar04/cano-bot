[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Coverage ──────────────────────────────────────────────────────────────────
addopts =
    --cov=plugins
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
    -v

# ── Suppress noisy loggers during tests ──────────────────────────────────────
log_cli = false
log_level = WARNING
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
