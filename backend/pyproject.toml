[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "httpx<1.0.0,>=0.25.1",
    "supabase>=2.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "slixmpp>=1.8.5",
    "croniter>=2.0.0",
    "pywebpush>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "pytest-cov<5.0.0,>=4.1.0",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG001",
    "T201",
]
ignore = [
    "E501",
    "B008",
    "W191",
    "B904",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"
omit = [
    "app/backend_pre_start.py",   # startup script, no testeable
    "app/initial_data.py",         # startup script, no testeable
    "app/tests_pre_start.py",      # test setup
    "app/utils.py",                # utilidades de email, requieren SMTP
    "app/crud.py",                 # CRUD SQLModel obsoleto (no se usa con Supabase)
    "app/core/security.py",        # hashing de passwords (no se usa con Supabase auth)
    "app/core/db.py",              # inicialización del cliente Supabase, requiere credenciales reales
    "app/api/routes/private.py",   # ruta privada de la plantilla
    "app/api/routes/login.py",     # autenticación delegada a Supabase, requiere integración real
    "app/api/deps.py",             # verificación JWT con Supabase, mockeado en todos los tests
    "app/services/xmpp.py",        # cliente XMPP, integración real
    "app/services/messages.py",    # depende de XMPP y Supabase conjuntamente
    "app/services/users.py",       # gestión de usuarios via Supabase admin API, integración real
]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true