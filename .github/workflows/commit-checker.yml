name: Commit Checker
on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'fix/*'
      - 'test/*'
      - 'docs/*'

jobs:
  validate-commits:
    name: Validate Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "You are in this branch: $BRANCH_NAME"
          git fetch origin develop
          commits=$(git log origin/develop..HEAD --no-merges --oneline)
          echo "Commits to validate:"
          echo "$commits"
          if [ -z "$commits" ]; then
            echo "No new commits to validate."
            exit 0
          fi
          while IFS= read -r commit; do
            mensaje=$(echo "$commit" | awk '{$1=""; print $0}' | xargs)
            if ! echo "$mensaje" | grep -Eq '^(feat|fix|test|docs|chore)(\([a-zA-Z0-9._-]+\))?:\ ?.+$'; then
              echo "Invalid commit message: '$mensaje'"
              exit 1
            fi
          done <<< "$commits"
          echo "All commit messages are valid."