name: SonarCloud Analysis

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e backend

      - name: Run backend tests with coverage
        run: |
          cd backend
          python -m pytest tests/api/routes/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-config=../.coveragerc \
            -q
        continue-on-error: true

      - name: Run bot tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=plugins \
            --cov-report=xml:bot-coverage.xml \
            --cov-config=.coveragerc \
            -q
        continue-on-error: true

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@5d6ebb23be9e65c9e3b6e66e4b69a8dc06a8d2e3
        with:
          args: >
            -Dsonar.scanner.force-manual-analysis=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR }}
